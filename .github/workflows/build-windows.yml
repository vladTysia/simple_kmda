name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Prepare bundled Tesseract (with Ukrainian data)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          $src = "C:\Program Files\Tesseract-OCR"
          Copy-Item $src build_tesseract -Recurse
          Get-ChildItem build_tesseract\tessdata -Filter *.traineddata | Remove-Item
          foreach ($f in "ukr", "eng", "osd") {
            Invoke-WebRequest "https://github.com/tesseract-ocr/tessdata_fast/raw/main/$f.traineddata" `
              -OutFile "build_tesseract\tessdata\$f.traineddata"
          }
          build_tesseract\tesseract.exe --list-langs

      - name: Build app with PyInstaller
        run: >
          pyinstaller --noconfirm --windowed --name PlenaryAgenda
          --hidden-import pythoncom --hidden-import win32com.client
          --collect-submodules send2trash
          --add-data "build_tesseract;tesseract"
          gui_app.py

      - name: Self-test the built app
        shell: pwsh
        run: |
          $p = Start-Process "dist\PlenaryAgenda\PlenaryAgenda.exe" -ArgumentList "--selftest","selftest-build.txt" -Wait -PassThru
          if (Test-Path selftest-build.txt) { Get-Content selftest-build.txt }
          if ($p.ExitCode -ne 0) { Write-Error "Built app self-test failed"; exit 1 }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PlenaryAgenda-Setup
          path: installer/PlenaryAgenda-Setup.exe

      - name: Install the installer on a clean Windows and self-test the installed app
        shell: pwsh
        run: |
          $p = Start-Process "installer\PlenaryAgenda-Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=$PWD\install.log" -Wait -PassThru
          Write-Host "Installer exit code: $($p.ExitCode)"
          $exe = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Recurse -Filter PlenaryAgenda.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { if (Test-Path install.log) { Get-Content install.log -Tail 40 }; Write-Error "PlenaryAgenda.exe not found after install"; exit 1 }
          Write-Host "Installed: $($exe.FullName)"
          $t = Start-Process $exe.FullName -ArgumentList "--selftest","selftest-installed.txt" -Wait -PassThru
          if (Test-Path selftest-installed.txt) { Get-Content selftest-installed.txt }
          if ($t.ExitCode -ne 0) { Write-Error "Installed app self-test failed"; exit 1 }

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            selftest-*.txt
            install.log
            build/PlenaryAgenda/warn-PlenaryAgenda.txt
          if-no-files-found: ignore
